<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم متجر كاف</title>
  <!-- استدعاء مكتبة Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f4; color: #222; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: auto; display: grid; gap: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h2 { margin-top: 0; color: #3E4A32; border-bottom: 2px solid #C89D54; padding-bottom: 8px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    input, select, button { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    button { background: #3E4A32; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #2d3624; }
    button:disabled { background: #999; cursor: not-allowed; }
    .btn-danger { background: #c0392b; padding: 6px 10px; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: right; padding: 10px; border-bottom: 1px solid #eee; }
    img.thumb { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; }
    .status { margin-top: 10px; font-weight: bold; color: #2e7d32; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. إضافة قسم جديد -->
  <div class="card">
    <h2>1. إضافة قسم جديد (Categories)</h2>
    <form id="category-form" class="form-grid">
      <input type="text" id="cat-name" placeholder="اسم القسم (مثلاً: عسل نحل)" required />
      <input type="text" id="cat-slug" placeholder="الكود بالإنجليزي (مثلاً: honey)" required />
      <input type="number" id="cat-sort" placeholder="الترتيب (مثلاً: 1)" value="0" />
      <button type="submit">حفظ القسم</button>
    </form>
    <div id="cat-status" class="status"></div>
  </div>

  <!-- 2. إضافة منتج جديد -->
  <div class="card">
    <h2>2. إضافة منتج جديد (Products)</h2>
    <form id="product-form" class="form-grid">
      <input type="text" id="prod-name" placeholder="اسم المنتج" required />
      <select id="prod-category" required>
        <option value="">-- اختر القسم --</option>
      </select>
      <input type="number" step="0.01" id="prod-price" placeholder="السعر (ج.م)" required />
      <input type="text" id="prod-weight" placeholder="الوزن (مثلاً: 1 كجم / 250 جم)" />
      <input type="file" id="prod-image" accept="image/*" />
      <button type="submit" id="prod-submit-btn">حفظ المنتج</button>
    </form>
    <div id="prod-status" class="status"></div>
  </div>

  <!-- 3. عرض المنتجات الحالية -->
  <div class="card">
    <h2>المنتجات المضافة حالياً</h2>
    <table>
      <thead>
        <tr>
          <th>الصورة</th>
          <th>المنتج</th>
          <th>القسم</th>
          <th>الوزن</th>
          <th>السعر</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody id="products-table"></tbody>
    </table>
  </div>
</div>

<script>
  // === إعدادات الربط مع مشروعك ===
  const SUPABASE_URL = 'https://mbuxmpwqhikfetjorolu.supabase.co';
  const SUPABASE_ANON_KEY = 'ضع_هنا_مفتاح_ANON_PUBLIC_KEY_الخاص_بك';

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // تحميل الأقسام في القائمة المنسدلة
  async function loadCategories() {
    const { data, error } = await db
      .from('categories')
      .select('*')
      .order('sort', { ascending: true });

    if (error) return console.error('خطأ في جلب الأقسام:', error.message);

    const select = document.getElementById('prod-category');
    select.innerHTML = '<option value="">-- اختر القسم --</option>';
    data.forEach(cat => {
      select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
    });
  }

  // إضافة قسم جديد
  document.getElementById('category-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('cat-name').value.trim();
    const slug = document.getElementById('cat-slug').value.trim();
    const sort = parseInt(document.getElementById('cat-sort').value) || 0;

    const { error } = await db.from('categories').insert([{ name, slug, sort }]);
    if (error) {
      alert('خطأ: ' + error.message);
    } else {
      document.getElementById('cat-status').textContent = 'تم إضافة القسم بنجاح!';
      e.target.reset();
      loadCategories();
    }
  });

  // دالة رفع الصورة لـ Bucket اسمه images وإرجاع اللينك
  async function uploadImage(file) {
    if (!file) return null;
    const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, '_');
    const fileName = `${Date.now()}-${cleanName}`;

    const { error } = await db.storage.from('images').upload(fileName, file);
    if (error) throw new Error('فشل رفع الصورة: ' + error.message);

    const { data } = db.storage.from('images').getPublicUrl(fileName);
    return data.publicUrl;
  }

  // إضافة منتج جديد
  document.getElementById('product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('prod-submit-btn');
    const status = document.getElementById('prod-status');
    btn.disabled = true;
    status.textContent = 'جاري الرفع والحفظ...';

    try {
      const file = document.getElementById('prod-image').files[0];
      const image_url = await uploadImage(file);

      const productData = {
        name: document.getElementById('prod-name').value.trim(),
        category_id: parseInt(document.getElementById('prod-category').value),
        price: parseFloat(document.getElementById('prod-price').value),
        weight: document.getElementById('prod-weight').value.trim(),
        image_url: image_url
      };

      const { error } = await db.from('products').insert([productData]);
      if (error) throw error;

      status.textContent = 'تم حفظ المنتج بنجاح!';
      e.target.reset();
      loadProducts();
    } catch (err) {
      alert(err.message);
      status.textContent = '';
    } finally {
      btn.disabled = false;
    }
  });

  // عرض المنتجات مع اسم القسم المرتبط بيها (Relational Join)
  async function loadProducts() {
    const { data, error } = await db
      .from('products')
      .select('*, categories(name)')
      .order('id', { ascending: false });

    if (error) return console.error('خطأ في جلب المنتجات:', error.message);

    const tbody = document.getElementById('products-table');
    tbody.innerHTML = data.map(p => `
      <tr>
        <td>${p.image_url ? `<img src="${p.image_url}" class="thumb" />` : 'بدون صورة'}</td>
        <td>${p.name}</td>
        <td>${p.categories ? p.categories.name : '-'}</td>
        <td>${p.weight || '-'}</td>
        <td>${p.price} ج.م</td>
        <td><button class="btn-danger" onclick="deleteProduct(${p.id})">حذف</button></td>
      </tr>
    `).join('');
  }

  // حذف منتج
  async function deleteProduct(id) {
    if (!confirm('متأكد إنك عاوز تحذف المنتج ده؟')) return;
    const { error } = await db.from('products').delete().eq('id', id);
    if (error) alert(error.message);
    else loadProducts();
  }

  // تشغيل عند فتح الصفحة
  loadCategories();
  loadProducts();
</script>

</body>
</html>
